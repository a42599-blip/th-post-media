name: cleanup-media

# 這個 repo 只當「本專案的貼文圖暫存庫」：發布過的圖不要一直累積。
# 每天清掉超過 DAYS 天的檔案，保留最新一天的量給還沒發布的排程。
on:
  schedule:
    - cron: '25 20 * * *'   # 每天 04:25（台北時間）
  workflow_dispatch:
    inputs:
      days:
        description: '保留幾天'
        default: '1'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 刪除過期暫存圖
        env:
          DAYS: ${{ github.event.inputs.days || '1' }}
        run: |
          python3 - <<'EOF'
          import os, subprocess, datetime
          days = int(os.environ.get("DAYS", "1"))
          cut = datetime.datetime.now() - datetime.timedelta(days=days)
          out = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          gone = []
          for f in out:
              if not f.startswith("posts/"):
                  continue
              try:
                  t = datetime.datetime.fromtimestamp(os.path.getmtime(f))
              except OSError:
                  continue
              if t < cut:
                  gone.append(f)
          for f in gone:
              os.remove(f)
          print("deleted", len(gone))
          EOF
      - name: Commit
        run: |
          git config user.name "pi-agent"
          git config user.email "a42599@gmail.com"
          git add -A
          git diff --quiet --cached || git commit -m "chore: 自動清理過期貼文圖"
          git push
